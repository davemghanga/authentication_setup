<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1">
    <title>Best Store</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>

<div class="container py-5">
    <div class="row">
        <div class="col-lg-6 mx-auto rounded border p-4">
            <h2 class="text-center mb-4">Register</h2>
            <hr />

            <form method="post" th:object="${registerDto}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:token="${_csrf.token}">

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">First Name</label>
                    <input class="form-control" th:field="*{firstName}">
                    <p th:if="${#fields.hasErrors('firstName')}" th:errorclass="text-danger"
                        th:errors="${firstName}"></p>
                </div>


                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Last Name</label>
                    <input class="form-control" th:field="*{lastName}">
                    <p th:if="${#fields.hasErrors('lastName')}" th:errorclass="text-danger"
                        th:errors="${lastName}"></p>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Email</label>
                    <input class="form-control" th:field="*{email}">
                    <p th:if="${#fields.hasErrors('email')}" th:errorclass="text-danger"
                        th:errors="${email}"></p>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Phone</label>
                    <input class="form-control" th:field="*{phone}">
                    <p th:if="${#fields.hasErrors('phone')}" th:errorclass="text-danger"
                        th:errors="${phone}"></p>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Password</label>
                    <input class="form-control" th:field="*{password}">
                    <p th:if="${#fields.hasErrors('password')}" th:errorclass="text-danger"
                        th:errors="${password}"></p>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Confirm Password</label>
                    <input class="form-control" th:field="*{confirmPassword}">
                    <p th:if="${#fields.hasErrors('confirmPassword')}" th:errorclass="text-danger"
                        th:errors="${confirmPassword}"></p>
                </div>

                <div class="row mb-3">
                    <div class="offset-sm-4 col-sm-4 d-grid">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                    <div class="col-sm-4 d-grid">
                        <a href="/" class="btn btn-outline-primary">Cancel</a>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>
<script th:src="@{webjars/bootstrap/css/bootstrap.min.js}"></script>
</body>

</html>
